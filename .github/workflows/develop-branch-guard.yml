name: develop-branch-guard

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Ensure develop branch exists after merges to main
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Validate develop branch existence
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[SECURITY] develop branch is missing";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "security,branch-protection-audit",
              per_page: 100
            });
            const existing = openIssues.data.find((i) => i.title === title);

            let missing = false;
            try {
              await github.rest.repos.getBranch({
                owner,
                repo,
                branch: "develop"
              });
            } catch (error) {
              if (error.status === 404) {
                missing = true;
              } else {
                throw error;
              }
            }

            if (!missing) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: [
                    "La rama `develop` vuelve a existir. Se cierra la alerta.",
                    "",
                    `- Repository: \`${owner}/${repo}\``,
                    `- Fecha (UTC): \`${new Date().toISOString()}\``,
                    `- Workflow run: ${runUrl}`
                  ].join("\n")
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: "closed"
                });
              }
              core.info("develop branch exists.");
              return;
            }

            const body = [
              "Se detectó que la rama `develop` no existe después de un merge a `main`.",
              "",
              `- Repository: \`${owner}/${repo}\``,
              `- Fecha (UTC): \`${new Date().toISOString()}\``,
              `- Workflow run: ${runUrl}`,
              "",
              "Acción recomendada: recrear `develop` y re-aplicar protección de ramas."
            ].join("\n");

            if (!existing) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["security", "branch-protection-audit"]
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
            }

            core.setFailed("develop branch is missing.");

