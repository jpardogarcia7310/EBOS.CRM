global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/customer360-alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ebos-crm-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "host.docker.internal:5013"
          - "172.28.0.1:5013"
          - "172.17.0.1:5013"
